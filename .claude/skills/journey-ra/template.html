<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css">
<title>{{PAGE_TITLE}}</title>
<style>
:root{
  --amb:#f5efe2;          /* 当前场景氛围色，由 JS 实时插值 */
  --ink:#efe9dd;
  --ink-dim:rgba(239,233,221,.55);
  --serif:"LXGW WenKai","霞鹜文楷","LXGW WenKai SC","Songti SC","Noto Serif SC","Source Han Serif SC",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:#070a12;color:var(--ink);font-family:var(--serif);
  line-height:2;overflow-x:hidden;
}
canvas#sky{position:fixed;inset:0;width:100vw;height:100vh;z-index:0}

/* ===== 进度轨道 ===== */
#rail{
  position:fixed;right:26px;top:50%;transform:translateY(-50%);z-index:8;
  display:flex;flex-direction:column;gap:13px;align-items:flex-end;
}
#rail .r{display:flex;align-items:center;gap:10px;cursor:pointer}
#rail .r i{
  width:5px;height:5px;border-radius:50%;flex-shrink:0;
  background:rgba(255,255,255,.16);transition:all .4s;
}
#rail .r.cur i{background:var(--amb);box-shadow:0 0 9px var(--amb);transform:scale(1.7)}
#rail .lbl{
  font-size:.72rem;letter-spacing:.12em;color:var(--ink);white-space:nowrap;
  padding:3px 12px;border-radius:999px;background:rgba(7,10,18,.78);
  border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(4px);
  opacity:0;transform:translateX(10px);transition:all .35s ease;pointer-events:none;
}
#rail:hover .lbl{opacity:1;transform:none}
#rail .r.cur .lbl{border-color:var(--amb);color:var(--amb)}

main{position:relative;z-index:1}

/* ===== 时刻场景（全屏居中） ===== */
.scene{min-height:118vh;display:flex;align-items:center;justify-content:center;padding:14vh 22px}
.stage{max-width:620px;text-align:center;opacity:0;transform:translateY(34px);filter:blur(6px);transition:opacity 1.6s ease,transform 1.6s ease,filter 1.6s ease}
.scene.on .stage,.station.on .stage{opacity:1;transform:none;filter:blur(0)}
.kicker{
  font-size:.8rem;letter-spacing:.55em;text-indent:.55em;color:var(--amb);
  margin-bottom:30px;opacity:.85;
}
.kicker::after{
  content:"";display:block;width:34px;height:1px;margin:16px auto 0;
  background:var(--amb);opacity:.5;
}
.narr{font-size:1.18rem;color:var(--ink);margin-bottom:38px;text-align:center}
.en{
  font-family:Georgia,"Times New Roman",serif;font-style:italic;
  font-size:.98rem;line-height:1.9;color:var(--amb);opacity:.92;margin-bottom:16px;
}
.zh{font-size:.95rem;color:var(--ink-dim);margin-bottom:10px}
.ref{font-size:.74rem;letter-spacing:.2em;color:rgba(239,233,221,.34)}

/* ===== 站点（左钉住 · 右细节流） ===== */
.station{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);align-items:stretch}
.pin{
  position:sticky;top:0;height:100vh;
  display:flex;align-items:center;justify-content:center;padding:0 3vw;
}
.pin .stage{max-width:520px}
.detail{
  display:flex;flex-direction:column;justify-content:center;
  padding:10vh 5vw 10vh 0;
}
.frag{
  min-height:60vh;display:flex;flex-direction:column;justify-content:center;
  max-width:440px;
  opacity:0;transform:translateY(30px);
  transition:opacity 1.3s ease,transform 1.3s ease;
}
.frag.on{opacity:1;transform:none}
.f-k{
  font-size:.78rem;letter-spacing:.4em;color:var(--amb);opacity:.85;margin-bottom:18px;
}
.f-en{
  font-family:Georgia,"Times New Roman",serif;font-style:italic;
  font-size:.92rem;line-height:1.9;color:var(--amb);opacity:.9;
  border-left:2px solid rgba(255,255,255,.18);padding-left:16px;margin-bottom:14px;
}
.f-zh{font-size:.93rem;color:var(--ink-dim);margin-bottom:8px}
.f-ref{font-size:.72rem;letter-spacing:.2em;color:rgba(239,233,221,.32)}

/* 开场 */
#s0 .narr{font-size:1.5rem;letter-spacing:.1em;line-height:2.3}
.hint{
  margin-top:60px;font-size:.8rem;letter-spacing:.4em;text-indent:.4em;
  color:var(--ink-dim);animation:drift 2.6s ease-in-out infinite;
}
@keyframes drift{0%,100%{transform:translateY(0);opacity:.45}50%{transform:translateY(9px);opacity:.95}}

/* 可选演示区（如棱镜 / 时间线 / 对比路径） */
.demo{margin:8px auto 42px}
.timeline{position:relative;max-width:460px;margin:0 auto 42px;text-align:left;padding-left:26px}
.timeline::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:rgba(255,255,255,.14)}
.tl-item{position:relative;padding:2px 0 20px}
.tl-item::before{content:"";position:absolute;left:-25px;top:14px;width:11px;height:11px;border-radius:50%;
  background:#070a12;border:3px solid var(--amb)}
.tl-item .t{font-weight:700;color:var(--amb);letter-spacing:.1em}
.tl-item .d{font-size:.9rem;color:var(--ink-dim)}
.paths{display:flex;gap:26px;justify-content:center;margin-top:46px;flex-wrap:wrap}
.path{
  width:210px;padding:30px 22px 26px;border-radius:16px;cursor:pointer;
  border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.02);
  transition:all .7s ease;
}
.path h3{font-size:1.05rem;letter-spacing:.3em;text-indent:.3em;margin-bottom:12px}
.path p{font-size:.86rem;color:var(--ink-dim);line-height:1.9}
.paths.p-a .path:not(.a),.paths.p-b .path:not(.b){opacity:.28;transform:scale(.96)}
.paths.p-a .path.a,.paths.p-b .path.b{transform:scale(1.04)}

/* 终章 */
#sLast .en{font-size:1.06rem;line-height:2.2}
#sLast .zh{font-size:1rem}
.again{
  margin-top:56px;font-family:var(--serif);font-size:.85rem;letter-spacing:.35em;text-indent:.35em;
  color:var(--ink-dim);background:none;border:1px solid rgba(255,255,255,.14);
  border-radius:999px;padding:11px 30px;cursor:pointer;transition:all .4s;
}
.again:hover{color:var(--ink);border-color:var(--amb)}

footer{
  position:relative;z-index:1;text-align:center;padding:40px 20px 56px;
  font-size:.76rem;color:rgba(239,233,221,.3);letter-spacing:.08em;line-height:2.2;
}
@media (max-width:900px){
  .station{display:block}
  .pin{position:static;height:auto;padding:12vh 22px 2vh}
  .pin .stage{margin:0 auto}
  .detail{padding:0 22px 6vh;align-items:center}
  .frag{min-height:auto;margin-bottom:7vh}
}
@media (max-width:640px){
  .narr{font-size:1.05rem}
  #s0 .narr{font-size:1.2rem}
  #rail{display:none}
}
</style>
</head>
<body>

<canvas id="sky"></canvas>
<div id="rail"></div>

<main>

{{STAGES}}

</main>

<footer>
{{FOOTER_NOTE}}
</footer>

<script>
/* ===== 星空画布（固定，勿改） ===== */
const cv=document.getElementById('sky'),cx=cv.getContext('2d');
let W,H,stars=[];
function size(){W=cv.width=innerWidth*devicePixelRatio;H=cv.height=innerHeight*devicePixelRatio;}
size();addEventListener('resize',size);
for(let i=0;i<230;i++)stars.push({x:Math.random(),y:Math.random(),z:.25+Math.random()*.75,p:Math.random()*6.28,s:Math.random()});

/* ===== 氛围色插值（固定，勿改） ===== */
function hex2rgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
const scenes=[...document.querySelectorAll('.scene,.station')].map(s=>({el:s,c:hex2rgb(s.dataset.c)}));
let amb=[245,239,226];
function lerp(a,b,t){return a+(b-a)*t}
function rgb2css(c,a){return `rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`}

/* ===== 渲染循环（固定，勿改） ===== */
let t=0;
function frame(){
  t+=.016;
  const sy=scrollY,wh=innerHeight;
  let target=scenes[0].c;
  for(const s of scenes){
    const r=s.el.getBoundingClientRect();
    if(r.top<wh*.55&&r.bottom>wh*.45){target=s.c;break}
  }
  for(let i=0;i<3;i++)amb[i]=lerp(amb[i],target[i],.045);
  const ac=amb;
  document.documentElement.style.setProperty('--amb',rgb2css(ac,1));

  cx.clearRect(0,0,W,H);
  const g=cx.createRadialGradient(W/2,H*.86,0,W/2,H*.86,H*.75);
  g.addColorStop(0,rgb2css(ac,.10));g.addColorStop(1,'rgba(0,0,0,0)');
  cx.fillStyle=g;cx.fillRect(0,0,W,H);
  const dark=1-Math.min(1,(Math.hypot(ac[0]-245,ac[1]-239))/200);
  for(const st of stars){
    const px=st.x*W,py=((st.y - sy*.00004*st.z)%1+1)%1*H;
    const tw=.5+.5*Math.sin(t*1.3+st.p);
    cx.globalAlpha=(0.12+0.5*tw*st.z)*(0.35+0.65*dark);
    cx.fillStyle=rgb2css(ac,1);
    const r=st.s*1.4*st.z*devicePixelRatio;
    cx.beginPath();cx.arc(px,py,r,0,6.28);cx.fill();
  }
  const oy=H*.62+Math.sin(t*.8)*10*devicePixelRatio;
  const og=cx.createRadialGradient(W/2,oy,0,W/2,oy,26*devicePixelRatio);
  og.addColorStop(0,rgb2css(ac,.9));og.addColorStop(.35,rgb2css(ac,.25));og.addColorStop(1,'rgba(0,0,0,0)');
  cx.globalAlpha=1;cx.fillStyle=og;
  cx.beginPath();cx.arc(W/2,oy,26*devicePixelRatio,0,6.28);cx.fill();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ===== 场景显影（固定，勿改） ===== */
const io=new IntersectionObserver(es=>{
  es.forEach(e=>e.target.classList.toggle('on',e.isIntersecting));
},{threshold:.01});
document.querySelectorAll('.scene,.station').forEach(s=>io.observe(s));

/* 细节片段显影（固定，勿改） */
const ioFrag=new IntersectionObserver(es=>{
  es.forEach(e=>e.target.classList.toggle('on',e.intersectionRatio>.15));
},{threshold:[0,.35,.6]});
document.querySelectorAll('.frag').forEach(f=>ioFrag.observe(f));

/* ===== 进度轨道（固定，勿改） ===== */
const rail=document.getElementById('rail');
scenes.forEach((s,i)=>{
  const row=document.createElement('div');row.className='r';
  const lbl=document.createElement('span');lbl.className='lbl';
  const k=s.el.querySelector('.kicker');
  lbl.textContent=k?k.textContent.trim():(i===0?'开始':'终章');
  const d=document.createElement('i');
  row.appendChild(lbl);row.appendChild(d);
  row.onclick=()=>s.el.scrollIntoView({behavior:'smooth'});
  rail.appendChild(row);
});
setInterval(()=>{
  const wh=innerHeight;
  scenes.forEach((s,i)=>{
    const r=s.el.getBoundingClientRect();
    rail.children[i].classList.toggle('cur',r.top<wh*.55&&r.bottom>wh*.45);
  });
},200);

/* ===== 本章定制交互 ===== */
/* @@CUSTOM_JS@@ */
</script>
</body>
</html>
